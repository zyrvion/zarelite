<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZAREL</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#fff;color:#111;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:290px;background:#f7f7f8;border-right:1px solid #eee;display:flex;flex-direction:column;padding:14px;gap:6px;transition:transform .2s;z-index:5}
#side .logo{font-weight:800;font-size:22px;letter-spacing:1px;padding:6px 8px 14px}
.btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #eee;font-size:15px;cursor:pointer}
.btn.plain{background:none;border:0}
.btn:active{background:#eee}
#hist{flex:1;overflow:auto;margin-top:8px}
#hist .it{padding:10px 12px;border-radius:10px;font-size:14px;color:#444;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hist .it:hover,#hist .it.on{background:#ececee}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px}
#menu{display:none;font-size:22px;background:none;border:0;padding:6px 10px}
#pill{margin-left:auto;font-size:12px;color:#666;background:#f1f1f3;padding:6px 12px;border-radius:20px}
#msgs{flex:1;overflow:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px}
.hero{margin:auto;text-align:center}
.hero h1{font-size:54px;letter-spacing:4px;font-weight:900}
.hero p{color:#888;margin-top:10px;font-size:14px}
.m{max-width:760px;width:100%;margin:0 auto;line-height:1.55;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:#f1f1f3;padding:11px 15px;border-radius:18px;width:fit-content;max-width:85%;margin-right:0;margin-left:auto}
.m.a small{display:block;color:#aaa;margin-top:6px;font-size:11.5px}
#box{padding:10px 14px 16px;max-width:800px;width:100%;margin:0 auto}
#in{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid #e3e3e6;border-radius:26px;padding:10px 10px 10px 18px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
#t{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:16px;max-height:140px;padding:6px 0}
#go{width:40px;height:40px;border-radius:50%;border:0;background:#111;color:#fff;font-size:18px;cursor:pointer}
#go:disabled{background:#ccc}
@media(max-width:760px){
#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:82%}
#side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
#menu{display:block}.hero h1{font-size:44px}}
</style></head><body>
<div id="app">
 <aside id="side">
  <div class="logo">ZAREL</div>
  <div class="btn" onclick="neuf()">＋ Nouvelle discussion</div>
  <div class="btn plain" onclick="info()">🧠 Mes cerveaux</div>
  <div style="font-size:12px;color:#999;padding:12px 8px 4px">Discussions</div>
  <div id="hist"></div>
  <div class="btn plain" style="font-size:13px;color:#888">Arta Lyon · THE NOSTRAS EMPIRE</div>
 </aside>
 <section id="main">
  <div id="top"><button id="menu" onclick="side.classList.toggle('open')">☰</button><span id="pill">cerveau : en veille</span></div>
  <div id="msgs"><div class="hero"><h1>ZAREL</h1><p>Écris. Le cerveau se réveille, répond, se rendort.</p></div></div>
  <div id="box"><div id="in"><textarea id="t" rows="1" placeholder="Écris à ZAREL…"></textarea><button id="go">↑</button></div></div>
 </section>
</div>
<script>
const URL_CERVEAU="https://zyrvion--zarel-chat-cerveau-parler.us-east.modal.run";
const $=i=>document.getElementById(i);
let S=JSON.parse(localStorage.zarel||"[]"),cur=null;
function save(){localStorage.zarel=JSON.stringify(S)}
function hist(){$("hist").innerHTML="";S.forEach((c,i)=>{const d=document.createElement("div");d.className="it"+(i===cur?" on":"");d.textContent=c.t||"Nouvelle discussion";d.onclick=()=>{cur=i;draw();$("side").classList.remove("open")};$("hist").appendChild(d)})}
function draw(){const m=$("msgs");m.innerHTML="";const c=S[cur];if(!c||!c.m.length){m.innerHTML='<div class="hero"><h1>ZAREL</h1><p>Écris. Le cerveau se réveille, répond, se rendort.</p></div>'}else c.m.forEach(x=>add(x.r,x.c,x.n,1));hist();m.scrollTop=1e9}
function add(r,c,n,q){const m=$("msgs");if(!q&&m.querySelector(".hero"))m.innerHTML="";const d=document.createElement("div");d.className="m "+(r=="user"?"u":"a");d.textContent=c;if(n){const s=document.createElement("small");s.textContent=n;d.appendChild(s)}m.appendChild(d);m.scrollTop=1e9;return d}
function neuf(){S.unshift({t:"",m:[]});cur=0;save();draw();$("side").classList.remove("open")}
function info(){alert("Cerveau actif : NostraEmpire/mirror-qwen3-1.7b\nHôte : Modal (CPU, réveil à la demande)\nAutres cerveaux : en cours de branchement.")}
async function envoyer(){
 const t=$("t").value.trim();if(!t)return;
 if(cur===null)neuf();
 const c=S[cur];if(!c.t)c.t=t.slice(0,40);
 c.m.push({r:"user",c:t});add("user",t);$("t").value="";$("go").disabled=true;
 const w=add("assistant","Le cerveau se réveille… (jusqu'à 70 s au premier message)");$("pill").textContent="cerveau : réveil…";
 try{
  const msgs=c.m.map(x=>({role:x.r,content:x.c})).slice(-10);
  const r=await fetch(URL_CERVEAU,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,max:500})});
  const j=await r.json();const rep=(j.reponse||"").trim()||"(réponse vide)";
  w.textContent=rep;const n=j.cerveau+" · "+j.hote;const s=document.createElement("small");s.textContent=n;w.appendChild(s);
  c.m.push({r:"assistant",c:rep,n});$("pill").textContent="cerveau : éveillé";
 }catch(e){w.textContent="Le cerveau n'a pas répondu. Réessaie dans un instant.";$("pill").textContent="cerveau : en veille"}
 save();hist();$("go").disabled=false;
}
$("go").onclick=envoyer;
$("t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();envoyer()}});
$("t").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"});
if(S.length){cur=0;draw()}
</script></body></html>
