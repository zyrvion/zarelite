<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZARELITE</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e8eefc;display:flex;flex-direction:column;height:100dvh}
header{padding:14px 16px;border-bottom:1px solid #1d2740;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:17px;letter-spacing:.5px}.st{font-size:11px;color:#5eead4}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.u{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:#182238;border:1px solid #24304d;border-bottom-left-radius:4px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #1d2740;background:#0c1220}
textarea{flex:1;resize:none;background:#141c2e;border:1px solid #24304d;color:#e8eefc;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;max-height:110px}
button{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600}
button:disabled{opacity:.45}
</style></head><body>
<header><h1>ZARELITE</h1><span class="st" id="st">cerveaux propres</span></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Écris à ZAREL…"></textarea><button id="b">Envoyer</button></form>
<script>
const API="https://zyrvion--zarel-chat-cerveau-parler.us-east.modal.run";
const log=document.getElementById('log'),q=document.getElementById('q'),f=document.getElementById('f'),b=document.getElementById('b'),st=document.getElementById('st');
const hist=JSON.parse(localStorage.getItem('zarel_hist')||'[]');
function add(role,txt){const d=document.createElement('div');d.className='m '+role;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
hist.slice(-40).forEach(m=>add(m.role==='user'?'u':'a',m.content));
function save(){localStorage.setItem('zarel_hist',JSON.stringify(hist.slice(-40)));}
f.onsubmit=async e=>{e.preventDefault();const t=q.value.trim();if(!t)return;
q.value='';q.style.height='auto';add('u',t);hist.push({role:'user',content:t});save();
b.disabled=true;st.textContent='réflexion…';const box=add('a','…');
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
const j=await r.json();const rep=(j.reponse||j.error||'pas de réponse').trim();
box.textContent=rep;hist.push({role:'assistant',content:rep});save();st.textContent='en ligne';}
catch(err){box.textContent='Cerveau injoignable pour le moment.';st.textContent='hors ligne';}
b.disabled=false;};
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,110)+'px';});
</script></body></html>
